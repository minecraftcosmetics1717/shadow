plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.ghosts.abyss'
version = '1.2.5'

minecraft {
    mappings channel: 'official', version: '1.20.1'

    mixin {
        add sourceSets.main, "abyss.refmap.json"
        config "abyss.mixins.json"
    }

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                abyss {
                    source sourceSets.main
                }
            }
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "abyss",
                "Specification-Vendor"    : "ghosts",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "Abyss",
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "ghosts",
                "MixinConfigs"            : "abyss.mixins.json"
        ])
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    implementation fg.deobf(files('libs/JujutsuCraft-ver50.1-forge-1.20.1.jar'))
    annotationProcessor fg.deobf(files('libs/JujutsuCraft-ver50.1-forge-1.20.1.jar'))   // ← add this

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // if other jars in libs also need mixin targets, do the same for them

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}